[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audi-a4-patcher"
version = "0.2.0"
description = "Local Audi A4 B9 diagnostics with a Textual interface and guarded UDS changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=2.1,<3", "textual>=7.5,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
audi-a4-patcher = "audi_workbench.cli:main"
audi-workbench = "audi_workbench.cli:main"

[project.urls]
Repository = "https://github.com/MaksimSurmach/AudiA4Patcher"
Issues = "https://github.com/MaksimSurmach/AudiA4Patcher/issues"

[tool.setuptools.packages.find]
include = ["audi_workbench*"]

[tool.setuptools.package-data]
audi_workbench = ["data/*.json", "tui.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

